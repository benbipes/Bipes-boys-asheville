<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2c"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#26354f" stroke-width="8"/>
  
  <!-- Mountain Silhouettes -->
  <polygon points="64,360 190,190 310,360" fill="#222f46" opacity="0.6"/>
  <polygon points="210,360 330,150 448,360" fill="#2a3a55" opacity="0.8"/>
  <polygon points="120,380 256,210 392,380" fill="url(#amberGrad)"/>
  
  <!-- Snow Cap / Peak Accent -->
  <polygon points="256,210 230,250 256,242 282,250" fill="#ffffff"/>
  
  <!-- Emblem: Pint Glass / Bourbon Glencairn -->
  <circle cx="256" cy="380" r="44" fill="#0b0f17" stroke="#fbbf24" stroke-width="6"/>
  <text x="256" y="394" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#fbbf24" text-anchor="middle">🍻</text>
  
  <!-- Stars / Ridge Accent -->
  <circle cx="140" cy="130" r="6" fill="#f59e0b"/>
  <circle cx="380" cy="110" r="4" fill="#f59e0b"/>
  <circle cx="256" cy="90" r="8" fill="#fbbf24"/>
